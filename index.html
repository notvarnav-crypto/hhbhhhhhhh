<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cinematic Hug 🤍</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>

<div id="leftArm" class="arm"></div>
<div id="rightArm" class="arm"></div>

<!-- Scene 1 -->
<div class="scene show" id="scene1">
    <h2>Somewhere in the universe...</h2>
</div>

<!-- Scene 2 -->
<div class="scene" id="scene2">
    <h3>Who is this hug for?</h3>
    <input id="nameInput" placeholder="Type a name">
    <button onclick="startRain()">Continue</button>
</div>

<!-- Scene 3 -->
<div class="scene" id="scene3">
    <h2>Let everything fall for a moment...</h2>
</div>

<!-- Scene 4 -->
<div class="scene" id="scene4">
    <h3>Hold to receive your hug 🤍</h3>
    <button id="holdBtn">HOLD</button>
</div>

<!-- Scene 5 -->
<div class="scene" id="scene5">
    <div id="envelope"></div>
    <p id="letterText"></p>
</div>

<script src="script.js"></script>
</body>
</html>
